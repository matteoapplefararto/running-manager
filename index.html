<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>RUNNING MANAGER</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#202329;--line:#30333b;--muted:#9da3ae;--text:#f4f5f7;--accent:#f28c45;--accent2:#ffad70;--green:#70c99a;--red:#f07878;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{min-height:100vh;display:flex}.sidebar{width:248px;position:fixed;inset:0 auto 0 0;background:#15171b;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 28px}.brand-mark{width:39px;height:39px;border-radius:13px;background:linear-gradient(145deg,#ffad70,#e76f2e);display:grid;place-items:center;color:#171717;font-weight:900;font-size:20px}.brand-name{font-weight:850;letter-spacing:.08em;font-size:14px}.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.12em;margin-top:2px}.nav{display:grid;gap:7px}.nav button,.mobile-nav button{border:0;background:transparent;color:#b9bdc6;text-align:left;padding:12px 13px;border-radius:12px;display:flex;gap:12px;align-items:center;font-weight:600}.nav button.active,.nav button:hover{background:#292c32;color:#fff}.nav button.active .ico{color:var(--accent)}.ico{width:20px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;color:var(--muted);font-size:12px;padding:12px}
main{margin-left:248px;width:calc(100% - 248px);padding:34px clamp(18px,4vw,54px) 60px;max-width:1500px}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.page-title{font-size:clamp(27px,3vw,38px);letter-spacing:-.04em;margin:4px 0 0}.sub{color:var(--muted);margin-top:5px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 15px;border-radius:12px;font-weight:700}.btn:hover{border-color:#555b66}.btn.primary{background:var(--accent);color:#171717;border-color:var(--accent)}.btn.primary:hover{background:var(--accent2)}.btn.danger{color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.btn.ghost{background:transparent}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:19px}.card h3{margin:0 0 12px;font-size:16px}.muted{color:var(--muted)}.empty{border:1px dashed #41454f;border-radius:16px;padding:35px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:6px}.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:13px;padding:13px;background:var(--panel2);border:1px solid #2d3037;border-radius:14px}.avatar{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:#393027;color:#ffb17d;display:grid;place-items:center;font-weight:800}.item-main{min-width:0;flex:1}.item-title{font-weight:750}.item-meta{font-size:12px;color:var(--muted);margin-top:3px}.item-actions{display:flex;gap:6px;align-items:center}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 13px}.section-head h2{font-size:18px;margin:0}.search{width:min(100%,330px);background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 13px}
.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:#bfc3cb;font-weight:700}.field input,.field textarea,.field select{width:100%;background:#111317;border:1px solid #383c45;color:var(--text);border-radius:11px;padding:11px 12px}.field textarea{min-height:130px;resize:vertical}.field small{color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.span2{grid-column:1/-1}
.modal-backdrop{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.modal-backdrop.show{display:flex}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#1b1e24;border:1px solid #41454f;border-radius:20px;padding:22px;box-shadow:0 25px 90px #0009}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:20px}.x{background:transparent;border:0;color:var(--muted);font-size:24px}.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.tabs{display:flex;gap:7px;overflow:auto;border-bottom:1px solid var(--line);margin:18px 0}.tabs button{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:11px 13px;border-bottom:2px solid transparent}.tabs button.active{color:var(--accent);border-color:var(--accent);font-weight:800}.profile-head{display:flex;gap:15px;align-items:center;background:linear-gradient(120deg,#28231f,#1b1e24);border:1px solid var(--line);padding:20px;border-radius:18px}.profile-head .avatar{width:58px;height:58px;font-size:20px}.profile-head h2{margin:0;font-size:23px}.profile-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.metric{font-size:clamp(36px,6vw,58px);font-weight:850;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.metric small{font-size:16px;color:var(--muted);letter-spacing:0}.timer-panel{text-align:center;padding:26px 12px}.timer-controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:16px 0}.measure-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.measure-row.head{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.measure-row strong{font-size:14px}.pace{color:var(--accent);font-weight:850}.split{display:grid;grid-template-columns:1fr 1fr;gap:13px}.preview{white-space:pre-wrap;background:#111317;border:1px solid var(--line);border-radius:13px;padding:16px;color:#e6e7ea;max-height:360px;overflow:auto;font-size:13px}.plan-card{cursor:pointer}.plan-card:hover{border-color:#686e79}.plan-preview{white-space:pre-wrap;color:#c9cdd5;font-size:12px;line-height:1.5;max-height:100px;overflow:hidden;margin-top:9px}.pill{display:inline-flex;border:1px solid #454a54;border-radius:99px;padding:4px 9px;font-size:11px;color:#c7cbd3}
canvas{width:100%;height:220px;display:block}.chart-wrap{background:#111317;border:1px solid var(--line);border-radius:14px;padding:12px}
.mobile-nav{display:none}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#f2f2f2;color:#171717;padding:11px 17px;border-radius:99px;font-weight:700;z-index:50;box-shadow:0 5px 25px #0008;display:none}
@media(max-width:800px){.sidebar{display:none}main{margin:0;width:100%;padding:calc(23px + env(safe-area-inset-top, 0px)) 16px calc(100px + env(safe-area-inset-bottom, 0px))}.mobile-nav{display:flex;position:fixed;z-index:10;bottom:0;left:0;right:0;padding:8px 7px calc(8px + env(safe-area-inset-bottom));background:#17191e;border-top:1px solid var(--line);justify-content:space-around}.mobile-nav button{flex-direction:column;gap:2px;padding:7px 9px;font-size:10px;text-align:center}.mobile-nav button.active{color:var(--accent)}.mobile-nav .ico{font-size:19px}.topline{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.grid,.split{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.measure-row{grid-template-columns:1fr 1fr 1fr auto;font-size:12px}.card{padding:15px}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Running Manager">
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">R</div><div><div class="brand-name">RUNNING MANAGER</div><div class="brand-sub">COACH WORKSPACE</div></div></div>
  <nav class="nav" id="sideNav">
    <button data-page="athletes" class="active"><span class="ico">♙</span> Atleti</button>
    <button data-page="calculator"><span class="ico">◷</span> Calcolatore ritmi</button>
    <button data-page="backup"><span class="ico">▣</span> Backup e ripristino</button>
  </nav>
  <div class="side-bottom">Spazio di lavoro locale<br><span style="color:var(--green)">● Dati salvati su questo dispositivo</span></div>
</aside>
<main id="main"></main>
<nav class="mobile-nav" id="mobileNav">
  <button data-page="athletes" class="active"><span class="ico">♙</span>Atleti</button>
  <button data-page="calculator"><span class="ico">◷</span>Ritmi</button>
  <button data-page="backup"><span class="ico">▣</span>Backup</button>
</nav>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
(() => {
const KEY='running_manager_v1';
let db=loadDB(), page='athletes', selectedAthlete=null, athleteTab='plans', measurements=[], timerStart=null,timerElapsed=0,timerInterval=null,timerRunning=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY))||{athletes:[]}}catch(e){return{athletes:[]}}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Spazio di archiviazione non disponibile o esaurito');return false}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function toast(msg){let t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2600)}
function fmtTime(sec){let cs=Math.round((sec%1)*100),whole=Math.floor(sec),m=Math.floor(whole/60),s=whole%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`}
function parseTime(v){let x=String(v).trim().replace(',','.');if(!x)return NaN;if(x.includes(':')){let p=x.split(':').map(Number);return p.length===2?p[0]*60+p[1]:p[0]*3600+p[1]*60+p[2]}return Number(x)}
function paceFor(distance,time){return distance>0&&time>0?time*1000/distance:NaN}
function paceText(sec){if(!Number.isFinite(sec))return '—';let total=Math.round(sec),m=Math.floor(total/60),s=total%60;return `${m}'${String(s).padStart(2,'0')}"/km`}
function athlete(id){return db.athletes.find(a=>a.id===id)}
function initials(a){return ((a.first||'')[0]||'')+((a.last||'')[0]||'')}
function nav(p){page=p;selectedAthlete=null;render()}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='athletes')renderAthletes();if(page==='calculator')renderCalculator();if(page==='backup')renderBackup()}
function header(kicker,title,sub,actions=''){return `<div class="topline"><div><div class="eyebrow">${kicker}</div><h1 class="page-title">${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function renderAthletes(){
 const main=$('#main');
 main.innerHTML=header('IL TUO GRUPPO','Atleti','Gestisci le anagrafiche e consulta tutto il lavoro svolto con ciascun atleta.',`<button class="btn primary" id="addAthlete">＋ Nuovo atleta</button>`)
 +`<div class="section-head"><h2>Archivio atleti <span class="pill">${db.athletes.length}</span></h2><input class="search" id="athleteSearch" placeholder="Cerca un atleta…"></div><div id="athleteList" class="list"></div>`;
 const draw=(q='')=>{let rows=db.athletes.filter(a=>(a.first+' '+a.last).toLowerCase().includes(q.toLowerCase()));$('#athleteList').innerHTML=rows.length?rows.map(a=>`<div class="item"><div class="avatar">${esc(initials(a).toUpperCase())}</div><div class="item-main"><div class="item-title">${esc(a.first)} ${esc(a.last)}</div><div class="item-meta">${[a.email,a.category].filter(Boolean).map(esc).join(' · ')||'Scheda atleta'}</div></div><div class="item-actions"><button class="btn small" data-open="${a.id}">Apri scheda →</button></div></div>`).join(''):`<div class="empty"><strong>${q?'Nessun risultato':'Nessun atleta inserito'}</strong>${q?'Prova con un altro nome.':'Crea la prima anagrafica per iniziare a organizzare il tuo gruppo.'}</div>`};
 draw();$('#athleteSearch').addEventListener('input',e=>draw(e.target.value));$('#addAthlete').onclick=()=>athleteModal();
 $('#athleteList').addEventListener('click',e=>{let b=e.target.closest('[data-open]');if(b)openAthlete(b.dataset.open)});
}
function athleteModal(id=null){let a=id?athlete(id):{};openModal(`${id?'Modifica atleta':'Nuovo atleta'}`,`
 <form id="athleteForm"><div class="form-grid">
 <div class="field"><label>Nome *</label><input name="first" required value="${esc(a.first||'')}" autocomplete="given-name"></div>
 <div class="field"><label>Cognome *</label><input name="last" required value="${esc(a.last||'')}" autocomplete="family-name"></div>
 <div class="field"><label>Data di nascita</label><input type="date" name="birth" value="${esc(a.birth||'')}"></div>
 <div class="field"><label>Sesso</label><select name="sex"><option value="">Non specificato</option><option ${a.sex==='F'?'selected':''} value="F">Femmina</option><option ${a.sex==='M'?'selected':''} value="M">Maschio</option><option ${a.sex==='Altro'?'selected':''} value="Altro">Altro</option></select></div>
 <div class="field"><label>Email</label><input type="email" name="email" value="${esc(a.email||'')}"></div>
 <div class="field"><label>Telefono</label><input name="phone" value="${esc(a.phone||'')}" inputmode="tel"></div>
 <div class="field"><label>Inizio collaborazione</label><input type="date" name="since" value="${esc(a.since||'')}"></div>
 <div class="field"><label>Categoria</label><select name="category"><option value="">Seleziona</option>${['Principiante','Intermedio','Avanzato','Agonista'].map(x=>`<option ${a.category===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field span2"><label>Obiettivi sportivi</label><textarea name="goals">${esc(a.goals||'')}</textarea></div>
 </div></form>`,`<button class="btn" data-close>Annulla</button><button class="btn primary" id="saveAthlete">Salva atleta</button>`);
 $('#saveAthlete').onclick=()=>{let f=$('#athleteForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f));if(id)Object.assign(a,d);else{a={...d,id:uid(),plans:[],workouts:[],notes:''};db.athletes.push(a)}persist();closeModal();render();toast(id?'Scheda atleta aggiornata':'Atleta aggiunto all’archivio')};
}
function openAthlete(id){selectedAthlete=id;athleteTab='plans';renderAthleteDetail()}
function renderAthleteDetail(){
 let a=athlete(selectedAthlete);if(!a){nav('athletes');return}
 let main=$('#main'),countPlans=(a.plans||[]).length,countWork=(a.workouts||[]).length;
 main.innerHTML=`<div class="topline"><div><button class="btn ghost small" id="backAthletes">← Tutti gli atleti</button><div class="eyebrow" style="margin-top:16px">SCHEDA ATLETA</div></div><div class="actions"><button class="btn small" id="editAthlete">Modifica anagrafica</button></div></div>
 <div class="profile-head"><div class="avatar">${esc(initials(a).toUpperCase())}</div><div><h2>${esc(a.first)} ${esc(a.last)}</h2><p>${[a.category,a.email,a.phone].filter(Boolean).map(esc).join(' · ')||'Profilo atleta'}</p></div></div>
 <div class="tabs"><button data-tab="info" class="${athleteTab==='info'?'active':''}">Anagrafica</button><button data-tab="plans" class="${athleteTab==='plans'?'active':''}">Schede settimanali <span class="pill">${countPlans}</span></button><button data-tab="workouts" class="${athleteTab==='workouts'?'active':''}">Allenamenti con coach <span class="pill">${countWork}</span></button><button data-tab="notes" class="${athleteTab==='notes'?'active':''}">Note personali</button></div><div id="athleteContent"></div>`;
 $('#backAthletes').onclick=()=>{selectedAthlete=null;renderAthletes()};$('#editAthlete').onclick=()=>athleteModal(a.id);
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{athleteTab=b.dataset.tab;renderAthleteDetail()});
 let c=$('#athleteContent');
 if(athleteTab==='info')c.innerHTML=`
 <div class="grid"><div class="card"><h3>Dati personali</h3>${infoRow('Nome e cognome',a.first+' '+a.last)}${infoRow('Data di nascita',a.birth)}${infoRow('Sesso',a.sex)}${infoRow('Email',a.email)}${infoRow('Telefono',a.phone)}</div><div class="card"><h3>Percorso sportivo</h3>${infoRow('Inizio collaborazione',a.since)}${infoRow('Categoria',a.category)}<div style="margin-top:15px;color:var(--muted);font-size:12px">Obiettivi</div><p>${esc(a.goals||'Nessun obiettivo inserito')}</p></div></div>`;
 if(athleteTab==='plans')renderPlans(c,a);
 if(athleteTab==='workouts')renderWorkouts(c,a);
 if(athleteTab==='notes')c.innerHTML=`<div class="card"><h3>Note personali del coach</h3><div class="field"><textarea id="athleteNotes" style="min-height:220px" placeholder="Annotazioni, feedback, aspetti da ricordare…">${esc(a.notes||'')}</textarea></div><button class="btn primary" id="saveNotes">Salva note</button></div>`,$('#saveNotes').onclick=()=>{a.notes=$('#athleteNotes').value;persist();toast('Note salvate')};
}
function infoRow(k,v){return `<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)"><span class="muted">${k}</span><strong style="text-align:right">${esc(v||'—')}</strong></div>`}
function renderPlans(c,a){let plans=a.plans||[];c.innerHTML=`<div class="section-head" style="margin-top:0"><h2>Schede di allenamento</h2><button class="btn primary" id="addPlan">＋ Carica scheda</button></div>${plans.length?`<div class="grid">${plans.slice().reverse().map(p=>`<div class="card plan-card" data-plan="${p.id}"><div style="display:flex;justify-content:space-between;gap:8px"><strong>${esc(p.title)}</strong><span class="pill">${new Date(p.created).toLocaleDateString('it-IT')}</span></div><div class="plan-preview">${esc(p.text)}</div><div style="display:flex;gap:8px;margin-top:13px"><button class="btn small" data-viewplan="${p.id}">Apri anteprima</button><button class="btn small danger" data-delplan="${p.id}">Elimina</button></div></div>`).join('')}</div>`:`<div class="empty"><strong>Nessuna scheda archiviata</strong>Incolla il programma settimanale dell'atleta per conservarlo qui.</div>`}`;
 $('#addPlan').onclick=()=>planModal(a.id);
 c.querySelectorAll('[data-viewplan]').forEach(b=>b.onclick=()=>{let p=plans.find(x=>x.id===b.dataset.viewplan);openModal(p.title,`<div class="preview">${esc(p.text)}</div>`,`<button class="btn" data-close>Chiudi</button>`)});
 c.querySelectorAll('[data-delplan]').forEach(b=>b.onclick=()=>{if(confirm('Eliminare questa scheda?')){a.plans=a.plans.filter(x=>x.id!==b.dataset.delplan);persist();renderAthleteDetail();toast('Scheda eliminata')}});
}
function planModal(id){openModal('Carica scheda settimanale',`<div class="field"><label>Nome della scheda</label><input id="planTitle" placeholder="Es. TRAINING NOVEMBRE 2026"></div><div class="field"><label>Testo del training da incollare *</label><textarea id="planText" style="min-height:230px" placeholder="Incolla qui la scheda settimanale…"></textarea><small>Il testo viene conservato così come lo incolli, compresi giorni, simboli e indicazioni.</small></div>`,`<button class="btn" data-close>Annulla</button><button class="btn primary" id="savePlan">Salva scheda</button>`);
 $('#savePlan').onclick=()=>{let text=$('#planText').value.trim();if(!text){toast('Incolla il testo della scheda');return}let a=athlete(id);a.plans=a.plans||[];a.plans.push({id:uid(),title:$('#planTitle').value.trim()||'Scheda allenamento',text,created:new Date().toISOString()});persist();closeModal();renderAthleteDetail();toast('Scheda archiviata')};
}
function renderWorkouts(c,a){let ws=(a.workouts||[]).slice().reverse();c.innerHTML=`<div class="section-head" style="margin-top:0"><h2>Allenamenti effettuati insieme al coach</h2><span class="pill">${ws.length} allenamenti</span></div>${ws.length?`<div class="list">${ws.map(w=>`<div class="item"><div class="avatar">◷</div><div class="item-main"><div class="item-title">${esc(w.name)}</div><div class="item-meta">${new Date(w.date+'T12:00:00').toLocaleDateString('it-IT')} · ${w.measurements.length} rilevazioni${w.location?' · '+esc(w.location):''}</div></div><div class="item-actions"><button class="btn small" data-work="${w.id}">Dettagli</button><button class="btn small danger" data-delwork="${w.id}">×</button></div></div>`).join('')}</div>`:`<div class="empty"><strong>Nessun allenamento registrato</strong>Gli allenamenti salvati dal calcolatore compariranno qui automaticamente.</div>`}`;
 c.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>workoutDetail(a.id,b.dataset.work));
 c.querySelectorAll('[data-delwork]').forEach(b=>b.onclick=()=>{if(confirm('Eliminare questo allenamento?')){a.workouts=a.workouts.filter(w=>w.id!==b.dataset.delwork);persist();renderAthleteDetail();toast('Allenamento eliminato')}});
}

+`<div class="grid"><div class="card"><h3>Impostazione prova</h3><div class="field"><label>Distanza (metri)</label><input id="distance" type="number" min="1" step="1" value="300" inputmode="decimal"></div><div class="field"><label>Tempo manuale (mm:ss.cc oppure secondi)</label><input id="manualTime" placeholder="Es. 01:05.30 oppure 65.30" inputmode="decimal"></div><div class="field"><label>Frequenza cardiaca (bpm)</label><input id="heartRate" type="number" min="1" max="250" placeholder="Es. 172" inputmode="numeric"></div><div class="timer-panel"><div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.13em">Cronometro integrato</div><div class="metric" id="timerDisplay">00:00.00</div><div class="timer-controls"><button class="btn primary" id="timerStart">▶ Avvia</button><button class="btn" id="timerStop">■ Ferma</button><button class="btn" id="timerReset">↺ Azzera</button></div><div class="muted" style="font-size:12px">Puoi usare il cronometro oppure inserire un tempo manualmente.</div></div><div class="card" style="background:#111317"><div class="muted" style="font-size:12px">RITMO CALCOLATO</div><div class="metric pace" id="paceResult">— <small>/km</small></div><div class="muted" id="paceExplain">Inserisci distanza e tempo</div></div><div style="display:flex;gap:9px;margin-top:14px"><button class="btn primary" style="flex:1" id="addMeasure">＋ Aggiungi rilevazione</button><button class="btn" id="clearMeasure">Pulisci</button></div></div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>Rilevazioni della sessione</h3><span class="pill" id="measureCount">0 prove</span></div><div id="measureList"><div class="empty" style="padding:24px"><strong>Ancora nessuna rilevazione</strong>Le prove aggiunte appariranno qui.</div></div><div class="chart-wrap" style="margin-top:17px"><div class="muted" style="font-size:11px;margin-bottom:8px">ANDAMENTO DEI RITMI · SESSIONE</div><canvas id="sessionChart" width="600" height="220"></canvas></div><button class="btn primary" id="saveWorkout" style="width:100%;margin-top:16px" disabled>Salva allenamento nell'archivio atleta</button></div></div>`;
 const update=()=>{let d=Number($('#distance').value),t=parseTime($('#manualTime').value);if(!Number.isFinite(t)||t<=0)t=timerElapsed;if(d>0&&t>0){let p=paceFor(d,t);$('#paceResult').innerHTML=paceText(p)+' <small>/km</small>';$('#paceExplain').textContent=`${d} metri in ${fmtTime(t)}`}else{$('#paceResult').innerHTML='— <small>/km</small>';$('#paceExplain').textContent='Inserisci distanza e tempo'}};

function drawChart(canvas,arr){if(!canvas)return;let ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#343841';ctx.fillStyle='#9299a5';ctx.font='13px sans-serif';for(let i=0;i<4;i++){let y=20+i*(h-50)/3;ctx.beginPath();ctx.moveTo(42,y);ctx.lineTo(w-15,y);ctx.stroke()}if(!arr||!arr.length){ctx.fillText('Aggiungi rilevazioni per visualizzare il grafico',55,h/2);return}let vals=arr.map(m=>paceFor(m.distance,m.time)),min=Math.min(...vals),max=Math.max(...vals);if(max-min<1)max=min+1;let xStep=(w-90)/Math.max(1,arr.length-1);ctx.strokeStyle='#f28c45';ctx.lineWidth=3;ctx.beginPath();vals.forEach((v,i)=>{let x=45+i*xStep,y=22+(v-min)/(max-min)*(h-65);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();vals.forEach((v,i)=>{let x=45+i*xStep,y=22+(v-min)/(max-min)*(h-65);ctx.fillStyle='#ffad70';ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d9dce2';ctx.font='12px sans-serif';ctx.fillText((i+1),x-3,h-12)})}
